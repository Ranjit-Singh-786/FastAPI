<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Services</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f9;
      margin: 0;
      padding: 0;
    }
    .container {
      width: 90%;
      margin: 50px auto;
      text-align: center;
    }
    h1 {
      color: #333;
      margin-bottom: 40px;
    }
    .services {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-around;
    }
    .service-card {
      background: #fff;
      width: 280px;
      margin: 20px;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      transition: transform 0.2s;
    }
    .service-card:hover {
      transform: scale(1.05);
    }
    .service-card h2 {
      color: #007BFF;
      margin-bottom: 15px;
    }
    .service-card p {
      color: #555;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Our Services</h1>
    <div class="services">
      {% for service in services %}
      <div class="service-card">
        <h2>{{ service.title }}</h2>
        <p>{{ service.desc }}</p>
      </div>
      {% endfor %}
    </div>
  </div>
</body>
</html>
