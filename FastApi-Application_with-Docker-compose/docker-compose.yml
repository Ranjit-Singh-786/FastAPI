services:
  portfolio-service:
    build:
      context: ./portfolio-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - API_URL=http://api-service:8001
    depends_on:
      - api-service
    networks:
      - portfolio-network

  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    networks:
      - portfolio-network

networks:
  portfolio-network:
    driver: bridge
